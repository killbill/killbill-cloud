{{- if eq (include "killbill.bundledDb" .) "mariadb" }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "killbill.dbName" . }}
  labels:
    {{- include "killbill.labels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.mariadb.service.port }}
      targetPort: mysql
      protocol: TCP
      name: mysql
  selector:
    {{- include "killbill.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: mariadb
{{- end }}
