{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "killbill.fullname" . }}
  labels:
    {{- include "killbill.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ .Values.database.password | toString | b64enc | quote }}
  admin-password: {{ .Values.killbill.adminPassword | toString | b64enc | quote }}
{{- end }}
