{{- if not .Values.existingSecret }}
{{- /* Keep the generated Kaui session key across upgrades: reuse the one already in the Secret */}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace (include "killbill.fullname" .) }}
{{- $kauiKey := "" }}
{{- if .Values.kaui.secretKeyBase }}
{{- $kauiKey = .Values.kaui.secretKeyBase | toString | b64enc }}
{{- else if and $existing $existing.data (hasKey $existing.data "kaui-secret-key-base") }}
{{- $kauiKey = index $existing.data "kaui-secret-key-base" }}
{{- else }}
{{- $kauiKey = randAlphaNum 128 | b64enc }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "killbill.fullname" . }}
  labels:
    {{- include "killbill.labels" . | nindent 4 }}
type: Opaque
data:
  db-password: {{ .Values.database.password | toString | b64enc | quote }}
  admin-password: {{ .Values.killbill.adminPassword | toString | b64enc | quote }}
  kaui-secret-key-base: {{ $kauiKey | quote }}
{{- end }}
