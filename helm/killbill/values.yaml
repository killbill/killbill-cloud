# Default values for the Kill Bill chart.
# It deploys Kill Bill, Kaui (the admin UI) and a database. The database is
# either a bundled MariaDB or PostgreSQL that comes with the Kill Bill and Kaui
# schemas already created, or an existing database server (database.external).

# Secrets for pulling images from a private registry, for example:
# imagePullSecrets:
#   - name: my-registry-secret
imagePullSecrets: []

# Override the chart name used in resource names.
nameOverride: ""
# Override the full resource name prefix.
fullnameOverride: ""

# Passwords are stored in a Secret created by the chart from
# database.password and killbill.adminPassword.
# To use your own Secret instead, set its name here. It must contain the keys
# "db-password" and "admin-password".
existingSecret: ""

killbill:
  replicaCount: 1

  image:
    repository: killbill/killbill
    tag: "0.24.22"
    pullPolicy: IfNotPresent

  # Password of the Kill Bill "admin" user, also used to log in to Kaui.
  # Ignored when existingSecret is set.
  adminPassword: password

  service:
    type: ClusterIP
    port: 8080

  # Extra environment variables for the Kill Bill container, for example:
  # extraEnv:
  #   - name: JAVA_OPTS
  #     value: "-Xmx2g"
  extraEnv: []

  # Extra volumes and mounts for the Kill Bill container, for example to mount
  # a file from a Secret.
  extraVolumes: []
  extraVolumeMounts: []

  resources: {}

kaui:
  replicaCount: 1

  image:
    repository: killbill/kaui
    tag: "4.0.31"
    pullPolicy: IfNotPresent

  service:
    type: ClusterIP
    port: 9090

  # Extra environment variables for the Kaui container.
  extraEnv: []

  resources: {}

database:
  # Database engine: "mariadb" (also for an external MySQL server) or "postgresql".
  type: mariadb

  # Password of the database user, stored in the Secret as "db-password".
  # Ignored when existingSecret is set. For a bundled database it only applies
  # when its data volume is empty (first install); changing it later does not
  # change the password stored in an existing database.
  password: killbill

  # Use an existing database server instead of a bundled one.
  # The Kill Bill and Kaui schemas must already exist in it.
  external:
    enabled: false
    host: ""
    # Leave empty for the engine's default port (3306 or 5432).
    port: ""
    user: ""
    killbillDatabase: killbill
    kauiDatabase: kaui

# Bundled MariaDB, used when database.type is "mariadb" and database.external.enabled is false.
# Kill Bill and Kaui connect as root.
mariadb:
  image:
    repository: killbill/mariadb
    tag: "0.24"
    pullPolicy: IfNotPresent

  service:
    port: 3306

  persistence:
    size: 10Gi
    accessMode: ReadWriteOnce
    # Leave empty to use the cluster's default StorageClass.
    storageClass: ""

  resources: {}

# Bundled PostgreSQL, used when database.type is "postgresql" and database.external.enabled is false.
# Kill Bill and Kaui connect as postgres.
postgresql:
  image:
    repository: killbill/postgresql
    tag: "0.24"
    pullPolicy: IfNotPresent

  service:
    port: 5432

  persistence:
    size: 10Gi
    accessMode: ReadWriteOnce
    # Leave empty to use the cluster's default StorageClass.
    storageClass: ""

  resources: {}
