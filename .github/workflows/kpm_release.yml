name: kpm_release

# Releases KPM:
#   1. bumps the version, tags the repository and pushes the kpm gem to RubyGems
#   2. builds the self-contained packages (the build downloads the released gem from RubyGems, so it must come first)
#   3. deploys the packages to Cloudsmith (https://maven.cloudsmith.io/killbill/kpm/)
#
# To only redo step 2 and 3 (the version is already tagged and the gem is already on RubyGems), set
# perform_version to a ref (tag, branch or SHA) whose kpm/pom.xml has the Cloudsmith deploy configuration.

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target version: given version number [x.x.x] (ignored when perform_version is set)'
        required: false
        default: ''
        type: string
      perform_version:
        description: 'Ref (tag, branch or SHA) to (re-)perform: skips the version bump, the tag and the gem release'
        required: false
        default: ''
        type: string
      release_kpm:
        description: 'whether to tag and release the kpm gem (ignored when perform_version is set)'
        required: true
        default: true
        type: boolean
      snapshot_only:
        description: 'whether to deploy a SNAPSHOT (unsigned) instead of a release'
        required: true
        default: false
        type: boolean

env:
  MAVEN_FLAGS: "-B --no-transfer-progress"
  MAVEN_OPTS: "-Xmx2G -XX:+ExitOnOutOfMemoryError -Dmaven.wagon.rto=60000 -Dmaven.wagon.httpconnectionManager.ttlSeconds=25 -Dmaven.wagon.http.retryHandler.count=3"
  # s4u/maven-settings-action cannot emit Maven's native <repositoryOrigins> server field, so
  # fall back to the legacy id-only credential matching (otherwise Maven 3.10+ drops the credentials)
  MAVEN_ARGS: -ntp -Dmaven.repository.credentialScope=id

jobs:
  kpm_release:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.inputs.perform_version }}
      - name: Setup git user
        env:
          BUILD_USER: ${{ secrets.BUILD_USER }}
          BUILD_TOKEN: ${{ secrets.BUILD_TOKEN }}
        run: |
          git config --global user.email "contact@killbill.io"
          git config --global user.name "Kill Bill core team"
          git config --global url."https://${BUILD_USER}:${BUILD_TOKEN}@github.com/".insteadOf "git@github.com:"
      - name: Configure Java
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
      - name: Configure Maven settings.xml
        uses: s4u/maven-settings-action@v4.0.0
        with:
          githubServer: false
          # "cloudsmith" is referenced by <distributionManagement/> in kpm/pom.xml.
          # id=gpg.passphrase lets maven-gpg-plugin sign non-interactively; ${env.GPG_PASSPHRASE} is Maven's own
          # settings.xml syntax (resolved by mvn from the env var at build time), not GitHub Actions interpolation,
          # so the real passphrase is never written to disk here.
          # `configuration: {}` is a hack for maven-settings-action validation (it requires id + (username or configuration)).
          servers: |
            [
              {"id": "cloudsmith", "username": "${{ secrets.CLOUDSMITH_DISTRIBUTION_MAN_USERNAME }}", "password": "${{ secrets.CLOUDSMITH_DISTRIBUTION_MAN_PASSWORD }}"},
              {"id": "gpg.passphrase", "passphrase": "${env.GPG_PASSPHRASE}", "configuration": {}}
            ]
      - name: Import GPG signing key
        if: github.event.inputs.snapshot_only == 'false'
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin
          # setup-java always (re)writes ~/.m2/settings.xml unless told otherwise, which would overwrite
          # the settings.xml generated above
          overwrite-settings: false
          gpg-private-key: ${{ secrets.GPG_SIGNING_KEY }}
      - name: Install packages
        run: |
          sudo apt-get -yq update
          sudo apt-get -y install libgdbm6 libgdbm-dev libncurses5-dev libyaml-dev libssl-dev
      - name: Set up RVM
        run: |
          curl -sSL https://get.rvm.io | bash
      - name: Set up Ruby
        run: |
          source $HOME/.rvm/scripts/rvm
          # See HOMEBREW_PORTABLE_RUBY_VERSION in tasks/package.rake
          ruby_version=$(sed -n "s/HOMEBREW_PORTABLE_RUBY_VERSION\s*=\s*'\([0-9.]*\).*'/\1/p" kpm/tasks/package.rake)
          rvm install $ruby_version --binary
          rvm --default use $ruby_version
      - name: Set up Bundler
        run: |
          source $HOME/.rvm/scripts/rvm
          gem install bundler -v 1.17.3 --no-document
      - name: Download Ruby dependencies
        run: |
          source $HOME/.rvm/scripts/rvm
          cd kpm
          bundle install
      - name: Tag repository
        if: github.event.inputs.perform_version == '' && github.event.inputs.release_kpm == 'true'
        run: |
          source $HOME/.rvm/scripts/rvm
          cd kpm
          mvn versions:set -DnewVersion=${{ github.event.inputs.target_version }}
          git add pom.xml
          git commit -m "kpm: update pom.xml for release"
          bundle exec gem bump -c -p -t -v ${{ github.event.inputs.target_version }}
      - name: Release Gem
        if: github.event.inputs.perform_version == '' && github.event.inputs.release_kpm == 'true'
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
        run: |
          source $HOME/.rvm/scripts/rvm
          mkdir -p ~/.gem
          cat << EOF > ~/.gem/credentials
          ---
          :rubygems_api_key: ${RUBYGEMS_API_KEY}
          EOF
          chmod 0600 ~/.gem/credentials
          cd kpm
          bundle install
          bundle exec gem release
          rm -f ~/.gem/credentials
      # Needs to happen before building the .tar.gz to get the right directory name
      - name: Set new SNAPSHOT version
        if: github.event.inputs.snapshot_only == 'true'
        run: |
          cd kpm
          current_version=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          # Need a -SNAPSHOT suffix
          snapshot_version="${current_version}-$(git rev-parse --short "$GITHUB_SHA")-SNAPSHOT"
          mvn versions:set -DnewVersion=${snapshot_version}
          echo "::notice ::Version is ${snapshot_version}"
      - name: Build self-contained packages
        run: |
          source $HOME/.rvm/scripts/rvm
          cd kpm
          ../bin/retry bundle exec rake package
      - name: Deploy release to Cloudsmith
        if: github.event.inputs.snapshot_only == 'false'
        env:
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          cd kpm
          mvn ${MAVEN_FLAGS} -Poss-release deploy
      - name: Deploy snapshot to Cloudsmith
        if: github.event.inputs.snapshot_only == 'true'
        run: |
          cd kpm
          mvn ${MAVEN_FLAGS} deploy
